[workspace]
resolver = "2"
members = [
  "crates/starroom-core",
  "crates/starroom-color",
  "crates/starroom-advisor",
  "crates/starroom-portrait",
  "crates/starroom-project",
  "crates/starroom-render",
  "crates/starroom-detail",
  "crates/starroom-geometry",
  "crates/starroom-optics",
  "crates/starroom-grading",
  "crates/starroom-color-management",
  "crates/starroom-heal",
  "crates/starroom-imageio",
  "crates/starroom-pipeline",
  "crates/starroom-raw",
  "crates/starroom-ai-denoise",
  "crates/starroom-reference",
  "crates/starroom-look",
  "crates/starroom-library",
  "crates/starroom-history",
  "src-tauri",
]
default-members = [
  "crates/starroom-core",
  "crates/starroom-color",
  "crates/starroom-advisor",
  "crates/starroom-portrait",
  "crates/starroom-project",
  "crates/starroom-render",
  "crates/starroom-detail",
  "crates/starroom-geometry",
  "crates/starroom-optics",
  "crates/starroom-grading",
  "crates/starroom-color-management",
  "crates/starroom-heal",
  "crates/starroom-imageio",
  "crates/starroom-pipeline",
  "crates/starroom-raw",
  "crates/starroom-ai-denoise",
  "crates/starroom-reference",
  "crates/starroom-look",
  "crates/starroom-library",
  "crates/starroom-history",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
