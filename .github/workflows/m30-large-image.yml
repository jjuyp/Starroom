name: M30 Large Image Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-image:
    name: Real 24-100MP Native Workflow
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          toolchain: stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-m30-large-${{ hashFiles('Cargo.lock') }}
      - shell: pwsh
        env:
          STARROOM_M30_LARGE_IMAGE: true
        run: cargo test --locked -p starroom-export --test m30_large_image -- --ignored --nocapture
