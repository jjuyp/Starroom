name: Windows UI Qualification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-ui-qualification.yml'
      - 'scripts/prepare-windows-ui-driver.ps1'
      - 'scripts/capture-windows-ui-startup.ps1'
      - 'scripts/windows-ui-*.mjs'
      - 'scripts/windows-ui-browser-policy.ps1'
      - 'src/App.tsx'
      - 'src/styles.css'
      - 'src/glass.css'
      - 'src/latestPreviewQueue.ts'
      - 'src/nativePreviewPresentation.ts'

permissions:
  contents: read

concurrency:
  group: windows-ui-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-webview:
    name: Real WebView2 / Native tone controls
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      STARROOM_WINDOWS_UI_GATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-release-ui-${{ hashFiles('Cargo.lock', 'src-tauri/tauri.conf.json', 'src-tauri/build.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-release-ui-
            ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-release-
      - name: Verify matching Microsoft-signed WebView2 driver
        shell: pwsh
        run: ./scripts/prepare-windows-ui-driver.ps1 -RepositoryRoot $PWD
      - run: npm ci
      - name: Build the production protocol without packaging an installer
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle
        id: production-build
      - name: Operate actual production WebView2 and Native controls
        shell: pwsh
        run: node scripts/windows-ui-qualification.mjs "--executable=$PWD/target/release/starroom-desktop.exe"
      - name: Preserve bounded public-fixture qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-ui-qualification
          path: |
            output/qualification/windows-ui-*/ui-qualification.json
            output/qualification/windows-ui-*/driver.log
            output/qualification/windows-ui-*/ui-failure.json
            output/qualification/windows-ui-*/startup-processes.json
            output/qualification/windows-ui-*/browser-policy.json
            output/qualification/windows-ui-*/failure.png
            output/qualification/windows-ui-*/success.png
          if-no-files-found: warn
          retention-days: 14
      - name: Retain completed native build even if a later UI assertion fails
        if: always() && steps.production-build.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
