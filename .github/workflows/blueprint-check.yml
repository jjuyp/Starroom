name: Blueprint Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run Level 3 Full Acceptance
        type: boolean
        default: false

concurrency:
  group: blueprint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
      color: ${{ steps.paths.outputs.color }}
      raw: ${{ steps.paths.outputs.raw }}
      detail: ${{ steps.paths.outputs.detail }}
      optics: ${{ steps.paths.outputs.optics }}
      geometry: ${{ steps.paths.outputs.geometry }}
      gpu: ${{ steps.paths.outputs.gpu }}
      ai: ${{ steps.paths.outputs.ai }}
      full: ${{ steps.paths.outputs.full }}
      rust_any: ${{ steps.paths.outputs.rust_any }}
      rust_matrix: ${{ steps.paths.outputs.rust_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: paths
        name: Dependency-aware path classification
        env:
          STARROOM_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STARROOM_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STARROOM_FORCE_FULL: ${{ inputs.full || 'false' }}
        run: node scripts/ci-changed-paths.mjs

  web-check:
    name: Web Check
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: npm run test:web -- --web-only
      - run: npm run lint
      - run: npm run build

  rust-check:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.full != 'true' && needs.changes.outputs.rust_any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.rust_matrix) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - id: rust
        shell: pwsh
        run: |
          $value = (rustc -Vv | Out-String)
          $bytes = [Text.Encoding]::UTF8.GetBytes($value)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "compiler=$hash" >> $env:GITHUB_OUTPUT
      - id: cargo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .starroom-cache/lensfun
            .starroom-cache/models
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-
      - shell: pwsh
        run: Write-Output "Cargo cache hit = ${{ steps.cargo-cache.outputs.cache-hit }}"
      - run: node scripts/test-target.mjs ${{ matrix.target }} --rust-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-${{ matrix.target }}-${{ github.run_id }}
          path: .starroom-reports/*.json
          include-hidden-files: true

  full-check-rust:
    name: Full Check / Rust
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - id: rust
        shell: pwsh
        run: |
          $value = (rustc -Vv | Out-String)
          $bytes = [Text.Encoding]::UTF8.GetBytes($value)
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "compiler=$hash" >> $env:GITHUB_OUTPUT
      - id: cargo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .starroom-cache/lensfun
            .starroom-cache/models
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-full
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.rust.outputs.compiler }}-${{ hashFiles('Cargo.lock') }}-
      - shell: pwsh
        run: Write-Output "Cargo cache hit = ${{ steps.cargo-cache.outputs.cache-hit }}"
      - run: node scripts/test-target.mjs --level full --rust-only
        env:
          STARROOM_PERFORMANCE_GATE: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-full-rust-${{ github.run_id }}
          path: .starroom-reports/*.json
          include-hidden-files: true

  full-check-web:
    name: Full Check / Web
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:infra
      - run: node scripts/test-target.mjs --level full --web-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: timing-full-web-${{ github.run_id }}
          path: .starroom-reports/*.json
          include-hidden-files: true
