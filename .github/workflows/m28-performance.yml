name: M28 Performance Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    name: Windows Performance Corpus
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .starroom-cache/lensfun
            .starroom-cache/models
          key: ${{ runner.os }}-${{ runner.arch }}-m28-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-m28-
      - run: npm ci
      - run: node scripts/test-target.mjs performance --rust-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m28-performance-${{ github.run_id }}
          path: .starroom-reports/*.json
          include-hidden-files: true
