name: Release Candidate Gate

on:
  workflow_dispatch:
  push:
    branches: [agent/starroom-v0.2-core-quality]

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows Installer / Runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-12
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run test:infra
      - run: npm run test:licenses
      - run: node scripts/validate-release.mjs
      - run: npm run build:desktop
      - shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -RepositoryRoot $PWD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starroom-windows-rc-${{ github.sha }}
          path: |
            target/release/starroom-desktop.exe
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
