name: Release Candidate Gate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc2-performance:
    name: RC2 Library / Preview Performance
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-test-rc2-performance-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-test-rc2-performance-
      - shell: pwsh
        env:
          STARROOM_RC2_PERFORMANCE_GATE: true
        run: cargo test --locked -p starroom-library rc2_two_hundred_asset_thumbnail_generation_and_cached_restart -- --ignored --nocapture
      - shell: pwsh
        env:
          STARROOM_RC2_PERFORMANCE_GATE: true
        run: cargo test --locked -p starroom-desktop rc2_release_preview_cache_interaction_and_viewport_timings -- --ignored --nocapture

  large-image:
    name: Real 24-100MP Native Workflow
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-test-m30-large-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-test-m30-large-
      - shell: pwsh
        env:
          STARROOM_M30_LARGE_IMAGE: true
        run: cargo test --locked -p starroom-export --test m30_large_image -- --ignored --nocapture

  windows-installer:
    name: Windows Installer / Runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-x86_64-pc-windows-msvc-release-
      - run: npm ci
      - run: npm run test:infra
      - run: npm run test:licenses
      - shell: pwsh
        run: ./scripts/prepare-release-models.ps1 -RepositoryRoot $PWD
      - run: node scripts/validate-release.mjs --require-release-models
      - run: npm run build:desktop:rc2
      - shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -RepositoryRoot $PWD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starroom-windows-rc-${{ github.sha }}
          path: |
            target/release/starroom-desktop.exe
            target/release/bundle/nsis/*.exe
            target/release/SHA256SUMS.txt
          if-no-files-found: error
